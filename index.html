<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Browser PC</title>

    <script src="https://copy.sh/v86/build/libv86.js"></script>

    <style>
        body {
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        #screen_container {
            width: 100%;
            height: 600px;
            border: 2px solid white;
            margin-top: 20px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<h1>Browser Linux</h1>

<div id="screen_container"></div>

<script>
window.onload = function () {

    new V86({
        wasm_path: "https://copy.sh/v86/build/v86.wasm",

        screen_container: document.getElementById("screen_container"),

        bios: {
            url: "https://copy.sh/v86/bios/seabios.bin",
        },

        vga_bios: {
            url: "https://copy.sh/v86/bios/vgabios.bin",
        },

        cdrom: {
            url: "https://copy.sh/v86/images/linux.iso",
        },

        memory_size: 256 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,

        autostart: true,
    });

};
</script>

</body>
</html>
