<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Browser PC</title>

    <script src="https://copy.sh/v86/build/libv86.js"></script>

    <style>
        body {
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        #screen_container {
            width: 100%;
            height: 600px;
            border: 2px solid white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>My Browser PC</h1>

<div id="screen_container"></div>

<script>
new V86({
    wasm_path: "https://copy.sh/v86/build/v86.wasm",

    screen_container: document.getElementById("screen_container"),

    bios: {
        url: "https://copy.sh/v86/bios/seabios.bin",
    },

    vga_bios: {
        url: "https://copy.sh/v86/bios/vgabios.bin",
    },

    cdrom: {
        url: "https://copy.sh/v86/images/linux.iso",
    },

    autostart: true,
});
</script>

</body>
</html>
